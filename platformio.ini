; ESP32-S NodeMCU v1.1 + 2.8" TFT SPI 240x320 (ILI9341) v1.2
; ESP-IDF (not Arduino). Wire per WIRING.md before upload.

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = espidf
monitor_speed = 115200
upload_port = COM3
upload_speed = 115200
; Chip must already be in download mode (TFT DC on GPIO2 breaks auto-reset).
upload_flags =
  --before=no_reset
  --after=hard_reset
board_build.flash_size = 2MB
board_upload.flash_size = 2MB
